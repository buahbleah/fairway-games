name: Android APK

# Builds an installable debug APK on every push, and on demand from the Actions
# tab. Nothing needs to be installed locally — GitHub supplies the JDK and the
# Android SDK.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The screenshot tooling is a dev dependency; CI has no use for Chromium.
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npm test

      - name: Build the web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Gradle generates a debug keystore on first use. On a fresh runner that
      # means a different signing key every build, and Android refuses to
      # install an update signed with a different key. Caching it keeps the
      # signature stable so each new APK installs over the last one.
      - name: Keep the debug signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -PfwVersionCode=${{ github.run_number }} -PfwVersionName=1.0.${{ github.run_number }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: fairway-games-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
