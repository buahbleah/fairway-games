<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0e2b21" />
    <meta name="description" content="Six golf games. Scored in seconds, between two shots." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-touch-180.png" />
    <title>Fairway Games</title>
  </head>
  <body>
    <!--
      Launch screen. Inline so it paints on the first frame with no extra
      request, and removed the moment React mounts — it must never delay access
      to the app, only cover the gap.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0e2b21;
        z-index: 100;
        transition: opacity 220ms ease-out;
      }
      #boot.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot svg {
        animation: boot-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(10px) scale(0.94); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; }
      }
    </style>
    <div id="boot">
      <svg width="88" height="88" viewBox="0 0 48 48" aria-label="Fairway Games" role="img">
        <circle cx="24" cy="24" r="21" fill="#14382b" />
        <path d="M20 34.5V13.5" stroke="#f4f1e8" stroke-width="2.4" stroke-linecap="round" />
        <path d="M20 14.6l9.6 3.3-9.6 3.4z" fill="#c79a4b" />
        <circle cx="30.5" cy="30" r="1.5" fill="#f4f1e8" opacity=".85" />
        <circle cx="26" cy="33.5" r="1.5" fill="#f4f1e8" opacity=".6" />
        <circle cx="33.5" cy="25.5" r="1.5" fill="#f4f1e8" opacity=".45" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
